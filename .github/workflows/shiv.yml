name: SHIV Playwright Publisher # Live execution requested

on:
  push:
    branches: [main]
    paths:
      - discovery.py
      - shiv.py
      - sites.json
      - requirements.txt
      - OPERATIONS.md
      - .github/workflows/shiv.yml
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: shiv-publisher
  cancel-in-progress: false

jobs:
  publish:
    # Explicit job-level lock protects shared operations/ state even if the
    # workflow later gains additional jobs or triggers.
    concurrency:
      group: shiv-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Discover global multilingual destinations (research only)
        run: python discovery.py
      - name: Run SHIV against explicitly permission-reviewed adapters only
        run: python shiv.py
      - name: Commit operation ledger
        run: |
          if [[ -n "$(git status --porcelain operations)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add operations/
            git commit -m "Update SHIV publication ledger"
            # The operator or another workflow may have committed while this
            # bounded browser job was running. Rebase the generated ledger
            # commit onto the latest main instead of dropping it on push reject.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
